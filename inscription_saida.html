
<!DOCTYPE html>
<html lang="fr" translate="yes">
<head>
    <title>Inscription</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="projet.css">
</head>
<body class="body_cmpt">
    <div class="lg">
        <img src="notre_logo.jpg" class="notre_logo">
       </div>
    <h1>Tirez le meilleur parti de votre vie professionnelle</h1>
    <fieldset> 
        <form action="inscription.php" method="post" enctype="multipart/form-data"><!-- name="form1"-->
           
        <h1 class="ss"><ins>S'inscrire</ins></h1>
        <div>
            <h3 class="chp_color"><label for="cv">Votre CV:<br></label>
                <input type="file" id="cv" name="choisir" accept=".pdf"></h3>
        </div>
            <div class="form-group">
                <input type="text" placeholder="Nom" id="nom" name="nom" required >
                <label for="nom" class="form-label">Nom</label>
                <i class="fa-solid fa-user"></i>
            </div>

            <div  class="form-group">
                <input type="text" placeholder="Saisir le prénom" id="prenom" name="prenom" required >
                <label for="prenom" class="form-label">Prénom</label>
            </div>

            <div  class="form-group">
                <input type="email" placeholder="Saisir l'email" id="email" name="email" required >
                <label for="email" class="form-label">john.doe@gmail.com</label>
            </div>
            
            <div  class="form-group">
                <input type="password" placeholder="Saisir le mot de passe" id="password1" name="password1" required > 
                <label for="password1" class="form-label">Mot de passe</label>
                <input type="button" value="Afficher" class="afficher" onclick="togglePasswordVisibility('password1')" >
                <div id="messageErreur" class="messageErreur"></div>
                <div id="valider">
                    <ul >
                        <li id="maj" class="invalid">Au moins une lettre majuscule </li>
                        <li id="min" class="invalid">Au moins une lettre minuscule </li>
                        <li id="nbr" class="invalid">Au moins un chiffre</li>
                        <li id="cara" class="invalid">Au moins huit caractères </li>
                        <li id="spec" class="invalid">Au moins un caractère spécial</li>
                    </ul>
                </div>
            </div>
           
                <div  class="form-group">
                    <input type="password" placeholder="Confirmer le mot de passe" id="password2" name="password2" required>
                    <label for="password2" class="form-label">Confirmer le mot de passe</label>
                    <input type="button" class="afficher" value="Afficher"  onclick="togglePasswordVisibility('password2')" >
                    <div id="erreur" class="erreur">

                     </div>
                </div>
            
            
       <div  class="form-group">
        <h3><label for="date" class="chp_color">Date de naissance</label>
                <input  type="date" id="date" required class="champ"></h3>
       </div>
            

            <div  class="form-group">
             <input type="tel" placeholder="Saisir le numéro de téléphone" id="numero" required >  
              <label for="numero" class="form-label">Numéro de téléphone</label>
            </div>
            
            <div  class="form-group">
             <h3 class="chp_color"> Niveau D'études<select class="select">
                <option value = "BAC" class="form-label"> BAC</option>
                <optgroup label = "BAC+2" class="form-label">
                    <option value="DEUST">DEUST</option>
                    <option value="DUT">DUT</option>
                    <option value="BTS">BTS</option>
                    <option value="DTS">DTS</option>
                    <option value="DT">DT</option>
                </optgroup>
               <optgroup label="BAC+3" class="form-label">
               <option value="LF">LF</option>
               <option value="LP">LP</option>
               <option value="LST">LST</option>
               </optgroup>
               <optgroup label="BAC+5" class="form-label">
                <option value="MP">MP</option>
                <option value="MR">MR</option>
                <option value="MST">MST</option>
                <option value="IE">IE</option>
                </optgroup>
            </select></h3>
               </div>
       
            <input type="submit" value="Accepter et S'inscrire" class="ins"> 
         
            <div class="ct"><h3>ou</h3></div>
            <button type="button" class="bt_ins"><img src="go.jpeg" alt="Logo de Google" class="img_insc"> Continuer avec Google </button>

            <div>
            <p class="deja_inscrit">Déjà inscrit(e)? <a href="connexion.html" class="identifier"> S'identifier</a></p>
            </div>
        </form>
   
    </fieldset>
    <script src="projet.js" defer></script> 
</body>
</html>
